<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login - Vinverth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: light; --background: #eaf2f8; --surface: #ffffff; --surface-soft: #f7fbff; --text: #1f2937; --muted: #526174; --line: #d5e0ea; --accent: #5b54bc; --accent-hover: #4c43a3; --error: #b42318; }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--background);
        font-family: Arial, sans-serif;
      }

      .login-card {
        width: min(100%, 448px);
        padding: 32px;
        border-radius: 16px;
        border-radius: 6px;
        background: var(--surface);
        box-shadow: none;
      }

      .eyebrow { display: none; }
      h1 { margin: 0 0 10px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
      .intro { margin: 0; color: var(--muted); font-size: 0.875rem; }
      .login-heading { margin-bottom: 32px; text-align: center; }
      form { display: grid; gap: 24px; }
      label { display: grid; gap: 8px; color: #cbd5e1; font-size: 0.875rem; font-weight: 600; }
      input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: 0;
        color: var(--text);
        background: var(--surface-soft);
        font: 1rem/1.3 Arial, sans-serif;
      }
      input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
      button {
        margin-top: 0;
        padding: 14px 18px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        font: 700 0.78rem/1.2 Arial, sans-serif;
        letter-spacing: 0;
        text-transform: none;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { cursor: wait; opacity: 0.65; }
      [role="alert"] { min-height: 1.25em; margin: -8px 0 0; padding: 12px; border: 1px solid rgba(200, 122, 59, 0.5); border-radius: 6px; color: var(--error); background: rgba(69, 31, 12, 0.5); font-size: 0.875rem; }
      [role="alert"]:empty { display: none; }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="login-heading">
        <h1>Admin Portal</h1>
        <p class="intro">Sign in to access your dashboard</p>
      </div>

      <form id="login-form">
        <label for="email">Email Address
          <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        </label>
        <label for="password">Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button id="login-button" type="submit">Sign In</button>
        <p id="login-message" role="alert" aria-live="polite"></p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script>
      const supabaseUrl = "https://kbzmmiipwerrybyjuaxv.supabase.co";
      const supabaseKey = "sb_publishable_GzLs9VdAK8oziEutyGyvAA__OcS1KFS";
      const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      const form = document.querySelector("#login-form");
      const button = document.querySelector("#login-button");
      const message = document.querySelector("#login-message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        button.disabled = true;
        button.textContent = "Checking...";

        try {
          const formData = new FormData(form);
          const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
            email: formData.get("email"),
            password: formData.get("password")
          });

          if (authError || !authData.user) {
            await _supabase.auth.signOut();
            message.textContent = "The email or password is incorrect.";
            return;
          }

          const { data: isAdmin, error: adminError } = await _supabase.rpc("is_admin");

          if (adminError || isAdmin !== true) {
            await _supabase.auth.signOut();
            message.textContent = adminError
              ? "Unable to verify administrator access. Please try again."
              : "This account is not an active VINVERTH administrator.";
            return;
          }

          window.location.assign("index.html");
        } catch (error) {
          await _supabase.auth.signOut();
          message.textContent = "Unable to sign in right now. Please try again.";
        } finally {
          button.disabled = false;
          button.textContent = "Sign In";
        }
      });
    </script>
  </body>
</html>
